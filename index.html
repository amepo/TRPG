<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141019">
<meta name="description" content="ブラウザだけで遊べる d20 系 TRPG。ソロプレイ・セッション支援・シナリオ工房。通信なし・完全オフラインで動きます。">
<title>灯火のテーブル — ブラウザで遊ぶ TRPG</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="灯火のテーブル">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="./css/trpg.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎲</text></svg>">
</head>
<body>

<header class="topbar">
  <button class="topbar__back" id="backBtn" hidden aria-label="戻る">‹</button>
  <h1 class="topbar__title" id="screenTitle">灯火のテーブル</h1>
  <div class="topbar__actions" id="topActions"></div>
</header>

<main id="screen" class="screen" aria-live="polite"></main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog class="sheet" id="sheet">
  <div class="sheet__head">
    <h2 class="sheet__title" id="sheetTitle"></h2>
    <button class="sheet__close" id="sheetClose" aria-label="閉じる">✕</button>
  </div>
  <div class="sheet__body" id="sheetBody"></div>
</dialog>

<script type="module" src="./js/main.js"></script>
</body>
</html>
